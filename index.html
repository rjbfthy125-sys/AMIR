<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة التاريخ التعليمية - الأستاذ أمير</title>

  <!-- خط عصري أنيق (Readex Pro + Tajawal) -->
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Firebase SDK (v10 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --accent: #d97706;
      --accent-hover: #b45309;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --shadow-lg: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --shadow-glow: 0 0 20px rgba(217, 119, 6, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Readex Pro', 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-body);
      background-image: 
        radial-gradient(at 0% 0%, rgba(217, 119, 6, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 20px 15px;
      direction: rtl;
      min-height: 100vh;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
      padding-top: 10px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    header h1 span {
      color: var(--accent);
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .view-switcher {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .tab-btn {
      padding: 12px 28px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--primary);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 10px 20px -5px rgba(15, 23, 42, 0.3);
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 30px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 12px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--primary);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--accent);
      box-shadow: var(--shadow-glow);
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(217, 119, 6, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-subtle {
      background-color: #f1f5f9;
      color: var(--primary);
      border: 1px solid var(--border-color);
    }

    .user-welcome-box {
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sub-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .sub-nav-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      background: transparent;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .sub-nav-btn.active {
      background: #f1f5f9;
      color: var(--accent);
    }

    .student-grid {
      display: grid;
      gap: 12px;
      margin-top: 15px;
    }

    .student-card-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 14px;
    }

    .badge {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .badge-success { background-color: #d1fae5; color: #065f46; }
    .badge-danger { background-color: #fee2e2; color: #991b1b; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>منصة <span>التاريخ</span> التعليمية</h1>
      <p>مع الأستاذ أمير — تجربة تعليمية وتفاعلية عصرية</p>
    </header>

    <div class="view-switcher">
      <button class="tab-btn active" id="tab-student" onclick="switchMainView('student')">🎓 بوابة الطالب</button>
      <button class="tab-btn" id="tab-teacher" onclick="switchMainView('teacher')">👑 لوحة الأستاذ</button>
    </div>

    <!-- 1. بوابة الطالب -->
    <div id="student-view">
      <div id="student-step-1" class="card">
        <h2 class="card-title">📝 تسجيل الدخول بالمنصة أولاً</h2>
        
        <div class="form-group">
          <label for="reg-name">اسم الطالب ثلاثي:</label>
          <input type="text" id="reg-name" placeholder="مثال: فتحي زكريا">
        </div>

        <div class="form-group">
          <label for="reg-phone">رقم الهاتف:</label>
          <input type="tel" id="reg-phone" placeholder="مثال: 01012345678">
        </div>

        <div class="form-group">
          <label for="reg-stage">المرحلة الدراسية:</label>
          <select id="reg-stage">
            <option value="الأول الإعدادي">الأول الإعدادي</option>
            <option value="الثاني الإعدادي">الثاني الإعدادي</option>
            <option value="الثالث الإعدادي">الثالث الإعدادي</option>
            <option value="الأول الثانوي">الأول الثانوي</option>
            <option value="الثاني الثانوي عام">الثاني الثانوي عام</option>
            <option value="الثاني الثانوي بكالوريا">الثاني الثانوي بكالوريا</option>
            <option value="الثالث الثانوي">الثالث الثانوي</option>
          </select>
        </div>

        <button class="btn btn-primary" onclick="loginOrRegisterStudent()">الدخول والإنضمام للمنصة 🚀</button>
      </div>

      <div id="student-step-2" class="card hidden">
        <div class="user-welcome-box">
          <div>
            <h3 id="welcome-student-name">أهلاً بك يا طالب</h3>
            <p id="welcome-student-info">المرحلة: - | الهاتف: -</p>
          </div>
          <button class="btn btn-subtle" style="width: auto; padding: 6px 14px; font-size: 0.8rem;" onclick="logoutStudent()">تغيير الحساب</button>
        </div>

        <h2 class="card-title">🔑 تسجيل حضور الحصة الحالية</h2>
        
        <div class="form-group">
          <label for="session-code">كود الحصة المعطى لك:</label>
          <input type="text" id="session-code" placeholder="أدخل كود الحصة">
        </div>

        <button class="btn btn-primary" onclick="submitSessionCode()">تأكيد وتسجيل الحضور ✨</button>

        <hr style="margin: 25px 0; border: none; border-top: 1px solid var(--border-color);">

        <button class="btn btn-subtle" onclick="updateStudentStage()">تحديث المرحلة الدراسية 🔄</button>
      </div>
    </div>

    <!-- 2. لوحة الأستاذ -->
    <div id="teacher-view" class="hidden">
      <div id="teacher-lock-screen" class="card" style="text-align: center; max-width: 450px; margin: 0 auto;">
        <h2 class="card-title" style="justify-content: center;">🔒 لوحة التحكم محمية</h2>
        <div class="form-group">
          <input type="password" id="teacher-password" placeholder="كلمة السر" style="text-align: center; font-size: 1.2rem;">
        </div>
        <button class="btn btn-primary" onclick="unlockTeacherDashboard()">دخول اللوحة</button>
      </div>

      <div id="teacher-content" class="card hidden">
        <h2 class="card-title">👑 لوحة إدارة المنصة — الأستاذ أمير</h2>

        <div style="background: #f1f5f9; padding: 20px; border-radius: 14px; margin-bottom: 25px;">
          <div class="form-group" style="margin-bottom: 10px;">
            <label for="teacher-set-code">تحديث كود الحصة الحالي النشط:</label>
            <div style="display: flex; gap: 10px;">
              <input type="text" id="teacher-set-code" placeholder="مثال: 2026">
              <button class="btn btn-primary" style="width: auto; padding: 0 25px;" onclick="saveActiveSessionCode()">حفظ الكود</button>
            </div>
          </div>
          <p id="current-active-code-display" style="font-size: 0.9rem; color: var(--accent); font-weight: 600;">الكود النشط حالياً: جاري التحميل...</p>
        </div>

        <div class="sub-nav">
          <button class="sub-nav-btn active" id="subtab-all" onclick="switchTeacherSubTab('all')">📋 لائحة المسجلين بالمنصة</button>
          <button class="sub-nav-btn" id="subtab-session" onclick="switchTeacherSubTab('session')">🎯 حضور الحصة الحالية</button>
        </div>

        <div class="form-group">
          <label for="filter-stage-select">اختر المرحلة لتصفية الطلاب:</label>
          <select id="filter-stage-select" onchange="renderTeacherData()">
            <option value="الكل">جميع المراحل الدراسية</option>
            <option value="الأول الإعدادي">الأول الإعدادي</option>
            <option value="الثاني الإعدادي">الثاني الإعدادي</option>
            <option value="الثالث الإعدادي">الثالث الإعدادي</option>
            <option value="الأول الثانوي">الأول الثانوي</option>
            <option value="الثاني الثانوي عام">الثاني الثانوي عام</option>
            <option value="الثاني الثانوي بكالوريا">الثاني الثانوي بكالوريا</option>
            <option value="الثالث الثانوي">الثالث الثانوي</option>
          </select>
        </div>

        <h3 id="list-section-title" style="font-size: 1.1rem; color: var(--primary); margin-top: 20px;">قائمة المسجلين بالمنصة</h3>
        <div class="student-grid" id="students-display-container"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBja36JoyQuVrOtwwjATqLO9hVE-VG5ShQ",
      authDomain: "mramir-a454d.firebaseapp.com",
      projectId: "mramir-a454d",
      storageBucket: "mramir-a454d.firebasestorage.app",
      messagingSenderId: "436223138839",
      appId: "1:436223138839:web:f620692d4fdf095cf59052",
      measurementId: "G-SGHS36BYN3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentStudent = null;
    let isTeacherUnlocked = false;
    let activeTeacherSubTab = 'all';

    window.onload = function() {
      const savedStudent = localStorage.getItem('history_app_student');
      if (savedStudent) {
        try {
          currentStudent = JSON.parse(savedStudent);
          showStudentStep2();
        } catch(e) {
          localStorage.removeItem('history_app_student');
        }
      }
    };

    function switchMainView(view) {
      document.getElementById('tab-student').classList.toggle('active', view === 'student');
      document.getElementById('tab-teacher').classList.toggle('active', view === 'teacher');
      document.getElementById('student-view').classList.toggle('hidden', view !== 'student');
      document.getElementById('teacher-view').classList.toggle('hidden', view !== 'teacher');

      if (view === 'teacher' && isTeacherUnlocked) {
        fetchActiveSessionCode();
        renderTeacherData();
      }
    }

    async function loginOrRegisterStudent() {
      const name = document.getElementById('reg-name').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const stage = document.getElementById('reg-stage').value;

      if (!name || !phone) {
        alert("يرجى إدخال اسمك ورقم هاتفك بالكامل!");
        return;
      }

      try {
        const studentRef = db.collection('students').doc(phone);
        const doc = await studentRef.get();

        if (doc.exists) {
          currentStudent = doc.data();
        } else {
          currentStudent = {
            name: name,
            phone: phone,
            stage: stage,
            updateCount: 0,
            lastResetDate: Date.now(),
            createdAt: new Date().toISOString()
          };
          await studentRef.set(currentStudent);
        }

        localStorage.setItem('history_app_student', JSON.stringify(currentStudent));
        alert(`أهلاً بك يا ${currentStudent.name}! تم تسجيل دخولك بنجاح بالمنصة.`);
        showStudentStep2();
      } catch (error) {
        console.error("خطأ أثناء تسجيل الطالب:", error);
        alert("❌ خطأ اتصال بالسيرفر: " + error.message + "\nتأكد من تطبيق Rules في الفايربيس!");
      }
    }

    function showStudentStep2() {
      document.getElementById('student-step-1').classList.add('hidden');
      document.getElementById('student-step-2').classList.remove('hidden');
      document.getElementById('welcome-student-name').innerText = `أهلاً بك: ${currentStudent.name}`;
      document.getElementById('welcome-student-info').innerText = `المرحلة: ${currentStudent.stage} | الهاتف: ${currentStudent.phone}`;
    }

    function logoutStudent() {
      localStorage.removeItem('history_app_student');
      currentStudent = null;
      document.getElementById('student-step-2').classList.add('hidden');
      document.getElementById('student-step-1').classList.remove('hidden');
    }

    async function submitSessionCode() {
      const inputCode = document.getElementById('session-code').value.trim();
      if (!inputCode) {
        alert("يرجى إدخال كود الحصة أولاً!");
        return;
      }

      try {
        const configDoc = await db.collection('settings').doc('config').get();
        const activeCode = configDoc.exists ? configDoc.data().activeCode : null;

        if (inputCode !== activeCode) {
          alert("❌ كود الحصة غير صحيح!");
          return;
        }

        const attendanceId = `${activeCode}_${currentStudent.phone}`;
        await db.collection('attendance').doc(attendanceId).set({
          phone: currentStudent.phone,
          name: currentStudent.name,
          stage: currentStudent.stage,
          sessionCode: activeCode,
          timestamp: new Date().toISOString()
        });

        alert("✨ تم تسجيل حضورك بنجاح لهذه الحصة!");
        document.getElementById('session-code').value = '';
      } catch (error) {
        console.error("خطأ في تسجيل الحضور:", error);
        alert("❌ تعذر تسجيل الحضور: " + error.message);
      }
    }

    async function updateStudentStage() {
      const newStage = document.getElementById('reg-stage').value;
      try {
        currentStudent.stage = newStage;
        await db.collection('students').doc(currentStudent.phone).update({ stage: newStage });
        localStorage.setItem('history_app_student', JSON.stringify(currentStudent));
        showStudentStep2();
        alert("✅ تم تعديل مرحلتك الدراسية بنجاح.");
      } catch (err) {
        alert("تعذر حفظ التعديلات: " + err.message);
      }
    }

    function unlockTeacherDashboard() {
      const pass = document.getElementById('teacher-password').value;
      if (pass === "1234") {
        isTeacherUnlocked = true;
        document.getElementById('teacher-lock-screen').classList.add('hidden');
        document.getElementById('teacher-content').classList.remove('hidden');
        fetchActiveSessionCode();
        renderTeacherData();
      } else {
        alert("❌ كلمة السر غير صحيحة!");
      }
    }

    async function saveActiveSessionCode() {
      const codeInput = document.getElementById('teacher-set-code');
      const code = codeInput.value.trim();
      if (!code) {
        alert("يرجى كتابة كود الحصة أولاً!");
        return;
      }

      try {
        await db.collection('settings').doc('config').set({ activeCode: code }, { merge: true });
        alert("✅ تم تحديث كود الحصة بنجاح!");
        fetchActiveSessionCode();
        codeInput.value = '';
      } catch (error) {
        console.error("خطأ في حفظ الكود:", error);
        alert("❌ فشل حفظ الكود: " + error.message + "\nيرجى التأكد من صلاحيات الفايربيس (Rules).");
      }
    }

    async function fetchActiveSessionCode() {
      try {
        const doc = await db.collection('settings').doc('config').get();
        if (doc.exists && doc.data().activeCode) {
          document.getElementById('current-active-code-display').innerText = `الكود النشط حالياً: ${doc.data().activeCode}`;
        } else {
          document.getElementById('current-active-code-display').innerText = `الكود النشط حالياً: غير محدد`;
        }
      } catch (error) {
        console.error("خطأ قراءة الكود:", error);
      }
    }

    function switchTeacherSubTab(tab) {
      activeTeacherSubTab = tab;
      document.getElementById('subtab-all').classList.toggle('active', tab === 'all');
      document.getElementById('subtab-session').classList.toggle('active', tab === 'session');
      document.getElementById('list-section-title').innerText = tab === 'all' ? "📋 لائحة المسجلين بالمنصة" : "🎯 حضور الحصة الحالية";
      renderTeacherData();
    }

    function renderTeacherData() {
      if (!isTeacherUnlocked) return;

      const selectedStage = document.getElementById('filter-stage-select').value;

      db.collection('settings').doc('config').get().then(configDoc => {
        const activeCode = configDoc.exists ? configDoc.data().activeCode : "";

        db.collection('students').onSnapshot(studentsSnapshot => {
          db.collection('attendance').where('sessionCode', '==', activeCode).get().then(attendanceSnapshot => {
            const attendedPhones = new Set();
            attendanceSnapshot.forEach(doc => attendedPhones.add(doc.data().phone));

            const container = document.getElementById('students-display-container');
            container.innerHTML = '';

            let studentsList = [];
            studentsSnapshot.forEach(doc => studentsList.push(doc.data()));

            if (selectedStage !== "الكل") {
              studentsList = studentsList.filter(s => s.stage === selectedStage);
            }

            if (studentsList.length === 0) {
              container.innerHTML = `<p style="text-align:center; padding: 20px; color: var(--text-muted);">لا يوجد طلاب مسجلون في هذه القائمة.</p>`;
              return;
            }

            studentsList.forEach(student => {
              const hasAttended = attendedPhones.has(student.phone);

              if (activeTeacherSubTab === 'session' && !hasAttended) return;

              const card = document.createElement('div');
              card.className = 'student-card-item';

              const badgeHTML = hasAttended 
                ? `<span class="badge badge-success">حضر الحصة 🟢</span>` 
                : `<span class="badge badge-danger">لم يحضر 🔴</span>`;

              card.innerHTML = `
                <div>
                  <h4 style="color: var(--primary); font-size: 1rem;">${student.name}</h4>
                  <p style="color: var(--text-muted); font-size: 0.85rem;">📱 ${student.phone} | 📚 ${student.stage}</p>
                </div>
                <div>${badgeHTML}</div>
              `;

              container.appendChild(card);
            });
          }).catch(err => console.error("خطأ جلب سجل الحضور:", err));
        }, err => console.error("خطأ جلب الطلاب:", err));
      }).catch(err => console.error("خطأ الإعدادات:", err));
    }
  </script>
</body>
</html>
